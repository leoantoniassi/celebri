# ============================================================
# Celebri — nginx do frontend (SPA + proxy da API)
# ============================================================
# ATENÇÃO: em nginx, `add_header` num bloco `location` SUBSTITUI todos os
# add_header herdados do nível `server`. Por isso o conjunto de cabeçalhos de
# segurança é repetido em cada location que define cabeçalhos próprios
# (/, /assets/ e /api/). Ao alterar a CSP, altere também frontend/vercel.json
# (o teste backend/src/__tests__/headersFrontend.test.js confere a consistência).
#
# CSP: style-src precisa de 'unsafe-inline' porque React/Tailwind aplicam estilos
# inline (atributo style); scripts continuam restritos a 'self' (o anti-FOUC
# está em /tema-inicial.js). connect-src: 'self' cobre /api (proxy abaixo) e
# viacep.com.br é a consulta de CEP do cadastro. Se a API ficar em outra origem
# (VITE_API_URL), acrescente-a ao connect-src.
# ============================================================

server_tokens off;

server {
    listen 8080;
    server_name localhost;

    # Cabeçalhos de segurança (nível server — vale para locations sem add_header)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS / redirecionamento HTTPS: o TLS é terminado pelo host (proxy/CDN), não
    # por este container, então ficam DESLIGADOS. Ao publicar com HTTPS, ative:
    #   1) no host/proxy que termina o TLS: redirecionar HTTP -> HTTPS;
    #   2) aqui, repetindo em CADA location que usa add_header (/, /assets/, /api/):
    #      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    #   Só adicione "preload" depois de validar todos os subdomínios em HTTPS.

    # Bloqueia dotfiles (.env, .git, .htaccess...), exceto /.well-known/ (ACME)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Assets com hash no nome (Vite): cache longo e imutável
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Servir o React (SPA). index.html e arquivos sem hash: sempre revalidar.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Proxy reverso para o backend (API)
    # A CSP e o Referrer-Policy da resposta vêm do backend (helmet: CSP da API e
    # `no-referrer` na página pública do convite) e NÃO são repetidos aqui.
    # Os demais são reafirmados; as cópias do backend são ocultadas para não duplicar.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 no backend: o rate limit usa o último IP de X-Forwarded-For
        # (o que ESTE nginx anexa). Se houver outro proxy/CDN na frente do nginx,
        # ajuste TRUST_PROXY para o número total de proxies.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
