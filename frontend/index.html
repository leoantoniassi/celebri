<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celebri — Gestão de Eventos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Anti-FOUC: repinta com a paleta do último acesso antes do primeiro
      // paint. Sem isto a tela aparece com a paleta padrão e só depois vira
      // a cor do buffet, o que fica visível como um "pisca".
      (function () {
        try {
          var cache = JSON.parse(localStorage.getItem('celebri:tenant') || 'null');
          if (cache && cache.paleta) {
            var raiz = document.documentElement;
            Object.keys(cache.paleta).forEach(function (token) {
              raiz.style.setProperty('--color-' + token, cache.paleta[token]);
            });
          }
        } catch (e) {
          // Storage indisponível: segue com a paleta compilada no CSS.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
