name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine  # mesma major do docker-compose.yml
        env:
          POSTGRES_DB: celebri_ci
          POSTGRES_USER: celebri
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U celebri -d celebri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco efêmero do serviço acima: permite rodar o teste de isolamento de tenant sem skip.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: celebri_ci
      DB_USER: celebri
      DB_PASS: ci-only-password
      JWT_SECRET: ci-only-secret-nao-usar-em-producao-0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Schema inicial e migrations
        working-directory: .
        run: PGPASSWORD="$DB_PASS" psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f database/init.sql
      - run: npm run migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
